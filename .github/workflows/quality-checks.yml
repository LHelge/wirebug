name: Reusable Quality Checks

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-checks:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The example project must stay clean: any error or warning fails.
      - name: Check the example project
        run: cargo run --locked -- check --strict examples

      - name: Render the example project
        run: cargo run --locked -- render examples --out "$RUNNER_TEMP/examples-out"
