name: CI

on:
  # Every pull request, whatever its base: a stacked pull request targets the
  # branch below it, and should be checked before that one merges.
  pull_request:

# Cancel superseded runs on the same PR branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Verify Format, Lint, and Tests
    uses: ./.github/workflows/quality-checks.yml
